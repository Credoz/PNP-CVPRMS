<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1E40"/>
      <stop offset="100%" stop-color="#060E20"/>
    </linearGradient>
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE082"/>
      <stop offset="50%" stop-color="#D4A744"/>
      <stop offset="100%" stop-color="#AA7C1E"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Shield -->
  <path d="M 128,12 L 226,32 C 230,140 180,206 128,244 C 76,206 26,140 26,32 Z"
        fill="url(#shieldNavy)"
        stroke="url(#goldTrim)"
        stroke-width="8"
        stroke-linejoin="round"
        filter="url(#dropShadow)"/>

  <!-- Inner Trim -->
  <path d="M 128,26 L 212,44 C 216,134 172,194 128,228 C 84,194 40,134 40,44 Z"
        fill="none"
        stroke="#B48828"
        stroke-width="2"
        stroke-dasharray="6,4"/>

  <!-- Gold Badge Star -->
  <polygon points="128,42 133,54 146,54 135,62 139,74 128,66 117,74 121,62 110,54 123,54"
           fill="url(#goldTrim)"
           stroke="#7A5610"
           stroke-width="1"/>

  <!-- Citation Sheet / Record -->
  <g filter="url(#dropShadow)">
    <rect x="88" y="78" width="80" height="92" rx="4" fill="#F8FAFC" stroke="url(#goldTrim)" stroke-width="3"/>
    <!-- Document Lines -->
    <line x1="102" y1="94" x2="154" y2="94" stroke="#0E1E40" stroke-width="3" stroke-linecap="round"/>
    <line x1="102" y1="108" x2="154" y2="108" stroke="#0E1E40" stroke-width="3" stroke-linecap="round"/>
    <line x1="102" y1="122" x2="136" y2="122" stroke="#0E1E40" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Validated Checkmark / Digital Seal -->
  <circle cx="150" cy="150" r="16" fill="#059669" stroke="#FFFFFF" stroke-width="2"/>
  <polyline points="142,150 147,155 158,143" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Labeling -->
  <text x="128" y="198"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        font-weight="900"
        letter-spacing="1.5"
        fill="url(#goldTrim)"
        text-anchor="middle">CVPRMS</text>

  <text x="128" y="215"
        font-family="Arial, Helvetica, sans-serif"
        font-size="9"
        font-weight="700"
        letter-spacing="1"
        fill="#CBD5E1"
        text-anchor="middle">AGOO POLICE</text>
</svg>
