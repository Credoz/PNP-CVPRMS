<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 1190" width="100%" height="100%" style="background-color: #ffffff;">
  <defs>
    <style>
      .table-card {
        fill: #ffffff;
        stroke: #0a0a0a;
        stroke-width: 2.8px;
      }
      .table-title {
        font-family: 'Consolas', 'Courier New', ui-monospace, Menlo, Monaco, monospace;
        font-weight: 700;
        font-size: 22px;
        fill: #000000;
        letter-spacing: 0.8px;
      }
      .col-name {
        font-family: 'Consolas', 'Courier New', ui-monospace, Menlo, Monaco, monospace;
        font-size: 15px;
        fill: #111111;
      }
      .col-pk {
        font-style: italic;
        font-weight: 600;
      }
      .col-type {
        font-family: 'Consolas', 'Courier New', ui-monospace, Menlo, Monaco, monospace;
        font-size: 13px;
        font-weight: 500;
        fill: #222222;
        text-anchor: end;
        letter-spacing: 0.4px;
      }
      .divider-line {
        stroke: #0a0a0a;
        stroke-width: 2.8px;
      }
      .conn-line {
        stroke: #0a0a0a;
        stroke-width: 2.4px;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- Connectors -->
  <g class="connectors-group">
    <path class="conn-line" d="M 600 305 L 510 305 L 510 125 L 400 125" />
    <path class="conn-line" d="M 600 625 L 440 625 L 440 135 L 400 135" />
    <path class="conn-line" d="M 950 595 L 985 595 L 985 125 L 950 125" />
    <path class="conn-line" d="M 950 685 L 1090 685 L 1090 125 L 1140 125" />
    <path class="conn-line" d="M 600 655 L 540 655 L 540 485 L 400 485" />
    <path class="conn-line" d="M 400 935 L 475 935 L 475 475 L 600 475" />
    <path class="conn-line" d="M 600 1055 L 565 1055 L 565 485 L 600 485" />
    <path class="conn-line" d="M 950 1085 L 1035 1085 L 1035 485 L 1140 485" />
  </g>

  <!-- Tables -->
  <g class="tables-group">
    <!-- TABLE: officers -->
    <g id="table-officers">
      <rect class="table-card" x="70" y="60" width="330" height="274" rx="16" ry="16" />
      <text class="table-title" x="235" y="92" text-anchor="middle">officers</text>
      <line class="divider-line" x1="70" y1="108" x2="400" y2="108" />
      <text class="col-name col-pk" x="90" y="129">officer_id</text>
      <text class="col-type" x="380" y="129">BIGINT</text>
      <text class="col-name" x="90" y="159">badge_number</text>
      <text class="col-type" x="380" y="159">STRING</text>
      <text class="col-name" x="90" y="189">rank</text>
      <text class="col-type" x="380" y="189">STRING</text>
      <text class="col-name" x="90" y="219">first_name</text>
      <text class="col-type" x="380" y="219">STRING</text>
      <text class="col-name" x="90" y="249">last_name</text>
      <text class="col-type" x="380" y="249">STRING</text>
      <text class="col-name" x="90" y="279">station</text>
      <text class="col-type" x="380" y="279">STRING</text>
      <text class="col-name" x="90" y="309">contact_number</text>
      <text class="col-type" x="380" y="309">STRING</text>
    </g>
    <!-- TABLE: checkpoints -->
    <g id="table-checkpoints">
      <rect class="table-card" x="600" y="60" width="350" height="274" rx="16" ry="16" />
      <text class="table-title" x="775" y="92" text-anchor="middle">checkpoints</text>
      <line class="divider-line" x1="600" y1="108" x2="950" y2="108" />
      <text class="col-name col-pk" x="620" y="129">checkpoint_id</text>
      <text class="col-type" x="930" y="129">BIGINT</text>
      <text class="col-name" x="620" y="159">location</text>
      <text class="col-type" x="930" y="159">STRING</text>
      <text class="col-name" x="620" y="189">date_conducted</text>
      <text class="col-type" x="930" y="189">DATE</text>
      <text class="col-name" x="620" y="219">time_start</text>
      <text class="col-type" x="930" y="219">TIME</text>
      <text class="col-name" x="620" y="249">time_end</text>
      <text class="col-type" x="930" y="249">TIME</text>
      <text class="col-name" x="620" y="279">shift_info</text>
      <text class="col-type" x="930" y="279">STRING</text>
      <text class="col-name" x="620" y="309">officer_id</text>
      <text class="col-type" x="930" y="309">BIGINT</text>
    </g>
    <!-- TABLE: vehicles -->
    <g id="table-vehicles">
      <rect class="table-card" x="1140" y="60" width="330" height="274" rx="16" ry="16" />
      <text class="table-title" x="1305" y="92" text-anchor="middle">vehicles</text>
      <line class="divider-line" x1="1140" y1="108" x2="1470" y2="108" />
      <text class="col-name col-pk" x="1160" y="129">vehicle_id</text>
      <text class="col-type" x="1450" y="129">BIGINT</text>
      <text class="col-name" x="1160" y="159">plate_number</text>
      <text class="col-type" x="1450" y="159">STRING</text>
      <text class="col-name" x="1160" y="189">vehicle_type</text>
      <text class="col-type" x="1450" y="189">STRING</text>
      <text class="col-name" x="1160" y="219">make</text>
      <text class="col-type" x="1450" y="219">STRING</text>
      <text class="col-name" x="1160" y="249">model</text>
      <text class="col-type" x="1450" y="249">STRING</text>
      <text class="col-name" x="1160" y="279">color</text>
      <text class="col-type" x="1450" y="279">STRING</text>
      <text class="col-name" x="1160" y="309">registered_owner</text>
      <text class="col-type" x="1450" y="309">STRING</text>
    </g>
    <!-- TABLE: violators -->
    <g id="table-violators">
      <rect class="table-card" x="70" y="420" width="330" height="304" rx="16" ry="16" />
      <text class="table-title" x="235" y="452" text-anchor="middle">violators</text>
      <line class="divider-line" x1="70" y1="468" x2="400" y2="468" />
      <text class="col-name col-pk" x="90" y="489">violator_id</text>
      <text class="col-type" x="380" y="489">BIGINT</text>
      <text class="col-name" x="90" y="519">first_name</text>
      <text class="col-type" x="380" y="519">STRING</text>
      <text class="col-name" x="90" y="549">last_name</text>
      <text class="col-type" x="380" y="549">STRING</text>
      <text class="col-name" x="90" y="579">license_number</text>
      <text class="col-type" x="380" y="579">STRING</text>
      <text class="col-name" x="90" y="609">id_type</text>
      <text class="col-type" x="380" y="609">STRING</text>
      <text class="col-name" x="90" y="639">id_number</text>
      <text class="col-type" x="380" y="639">STRING</text>
      <text class="col-name" x="90" y="669">address</text>
      <text class="col-type" x="380" y="669">STRING</text>
      <text class="col-name" x="90" y="699">contact_number</text>
      <text class="col-type" x="380" y="699">STRING</text>
    </g>
    <!-- TABLE: tickets -->
    <g id="table-tickets">
      <rect class="table-card" x="600" y="410" width="350" height="484" rx="16" ry="16" />
      <text class="table-title" x="775" y="442" text-anchor="middle">tickets</text>
      <line class="divider-line" x1="600" y1="458" x2="950" y2="458" />
      <text class="col-name col-pk" x="620" y="479">ticket_id</text>
      <text class="col-type" x="930" y="479">BIGINT</text>
      <text class="col-name" x="620" y="509">ticket_number</text>
      <text class="col-type" x="930" y="509">STRING</text>
      <text class="col-name" x="620" y="539">date_issued</text>
      <text class="col-type" x="930" y="539">DATE</text>
      <text class="col-name" x="620" y="569">time_issued</text>
      <text class="col-type" x="930" y="569">TIME</text>
      <text class="col-name" x="620" y="599">checkpoint_id</text>
      <text class="col-type" x="930" y="599">BIGINT</text>
      <text class="col-name" x="620" y="629">officer_id</text>
      <text class="col-type" x="930" y="629">BIGINT</text>
      <text class="col-name" x="620" y="659">violator_id</text>
      <text class="col-type" x="930" y="659">BIGINT</text>
      <text class="col-name" x="620" y="689">vehicle_id</text>
      <text class="col-type" x="930" y="689">BIGINT</text>
      <text class="col-name" x="620" y="719">confiscated_item</text>
      <text class="col-type" x="930" y="719">STRING</text>
      <text class="col-name" x="620" y="749">vehicle_disposition</text>
      <text class="col-type" x="930" y="749">STRING</text>
      <text class="col-name" x="620" y="779">impound_receipt_no</text>
      <text class="col-type" x="930" y="779">STRING</text>
      <text class="col-name" x="620" y="809">screening_status</text>
      <text class="col-type" x="930" y="809">STRING</text>
      <text class="col-name" x="620" y="839">total_fine</text>
      <text class="col-type" x="930" y="839">DECIMAL</text>
      <text class="col-name" x="620" y="869">status</text>
      <text class="col-type" x="930" y="869">STRING</text>
    </g>
    <!-- TABLE: offenses -->
    <g id="table-offenses">
      <rect class="table-card" x="1140" y="420" width="330" height="214" rx="16" ry="16" />
      <text class="table-title" x="1305" y="452" text-anchor="middle">offenses</text>
      <line class="divider-line" x1="1140" y1="468" x2="1470" y2="468" />
      <text class="col-name col-pk" x="1160" y="489">offense_id</text>
      <text class="col-type" x="1450" y="489">BIGINT</text>
      <text class="col-name" x="1160" y="519">offense_code</text>
      <text class="col-type" x="1450" y="519">STRING</text>
      <text class="col-name" x="1160" y="549">description</text>
      <text class="col-type" x="1450" y="549">STRING</text>
      <text class="col-name" x="1160" y="579">fine_amount</text>
      <text class="col-type" x="1450" y="579">DECIMAL</text>
      <text class="col-name" x="1160" y="609">law_violated</text>
      <text class="col-type" x="1450" y="609">STRING</text>
    </g>
    <!-- TABLE: payments -->
    <g id="table-payments">
      <rect class="table-card" x="70" y="810" width="330" height="244" rx="16" ry="16" />
      <text class="table-title" x="235" y="842" text-anchor="middle">payments</text>
      <line class="divider-line" x1="70" y1="858" x2="400" y2="858" />
      <text class="col-name col-pk" x="90" y="879">payment_id</text>
      <text class="col-type" x="380" y="879">BIGINT</text>
      <text class="col-name" x="90" y="909">or_number</text>
      <text class="col-type" x="380" y="909">STRING</text>
      <text class="col-name" x="90" y="939">ticket_id</text>
      <text class="col-type" x="380" y="939">BIGINT</text>
      <text class="col-name" x="90" y="969">date_paid</text>
      <text class="col-type" x="380" y="969">DATE</text>
      <text class="col-name" x="90" y="999">amount_paid</text>
      <text class="col-type" x="380" y="999">DECIMAL</text>
      <text class="col-name" x="90" y="1029">handled_by</text>
      <text class="col-type" x="380" y="1029">STRING</text>
    </g>
    <!-- TABLE: ticket_offenses -->
    <g id="table-ticket_offenses">
      <rect class="table-card" x="600" y="960" width="350" height="184" rx="16" ry="16" />
      <text class="table-title" x="775" y="992" text-anchor="middle">ticket_offenses</text>
      <line class="divider-line" x1="600" y1="1008" x2="950" y2="1008" />
      <text class="col-name col-pk" x="620" y="1029">ticket_offense_id</text>
      <text class="col-type" x="930" y="1029">BIGINT</text>
      <text class="col-name" x="620" y="1059">ticket_id</text>
      <text class="col-type" x="930" y="1059">BIGINT</text>
      <text class="col-name" x="620" y="1089">offense_id</text>
      <text class="col-type" x="930" y="1089">BIGINT</text>
      <text class="col-name" x="620" y="1119">fine_amount</text>
      <text class="col-type" x="930" y="1119">DECIMAL</text>
    </g>
  </g>
</svg>